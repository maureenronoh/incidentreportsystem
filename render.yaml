services:
  - type: web
    name: ireporter-backend
    env: python
    buildCommand: pip install -r requirements_simple.txt
    startCommand: python backend_complete_simple.py
    envVars:
      - key: MONGODB_URI
        value: mongodb://localhost:27017/ireporter
      - key: PORT
        value: 5001
      - key: JWT_SECRET_KEY
        generateValue: true
