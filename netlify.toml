# Netlify Configuration for iReporter Frontend

[build]
  # Base directory where the frontend code is located
  base = "ireporter-frontend"
  
  # Build command
  command = "npm run build"
  
  # Directory with the build output (relative to base)
  publish = "build"
  
  # Environment variables for build
  [build.environment]
    CI = "false"
    REACT_APP_API_URL = "https://incidentreportsystem-qtqz.onrender.com/api"

# Redirect rules for React Router (SPA)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
